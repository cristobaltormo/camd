[package]
name = "camd"
version = "3.0.0"
edition = "2024"
license = "MIT"
description = "Self-hosted camera server for the ESP32-CAM: live view, motion and object detection, clips, alerts"
repository = "https://github.com/cristobaltormo/camd"
publish = false
build = "build.rs"

[[bin]]
name = "camd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
rusqlite = { version = "0.42", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-graceful", "http1"] }
tower-service = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
base64 = "0.22"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
ciborium = "0.2"
aes-gcm = "0.10"
hkdf = "0.12"
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
jpeg-encoder = "0.6"
tract-onnx = "0.23"
libc = "0.2"

[build-dependencies]
sha1 = "0.10"
regex-lite = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
