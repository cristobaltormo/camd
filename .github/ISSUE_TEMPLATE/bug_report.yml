name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you got instead. A screenshot helps for interface problems.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options: [Server, Web app, Firmware, Installer or Docker, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: camd version
      description: Shown in Settings, System, or by `camd-ctl version`.
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Settings, System, Camera. Leave empty if the problem is not about the camera.
  - type: dropdown
    id: install
    attributes:
      label: How it runs
      options: [Docker, install.sh on Debian or Ubuntu, From source, Other]
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "`journalctl -u camd -n 100` or `docker compose logs --tail 100 camd`. Remove tokens and addresses you do not want to share."
      render: text
