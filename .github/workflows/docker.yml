name: docker

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      push:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose binaries go into the image, for example v3.0.0
        type: string
        required: true
      push:
        description: Push the image to GHCR
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'camd-linux-*' --pattern SHA256SUMS
          cd dist
          grep -E '  camd-linux-(amd64|arm64)$' SHA256SUMS > checked
          test "$(wc -l < checked)" -eq 2
          sha256sum -c checked
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
