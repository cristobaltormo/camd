name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio esptool
      - run: pio run -d firmware
      - run: firmware/tools/merge.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: firmware/camd-esp32cam.bin
      - run: |
          mkdir site
          cp firmware/camd-esp32cam.bin site/
          cp firmware/web-installer/* site/
          sed -i "s/__VERSION__/${GITHUB_REF_NAME}/" site/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
