<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camd camera installer</title>
<script type="module" src="https://unpkg.com/esp-web-tools@10.0.1/dist/web/install-button.js?module"></script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 20px; }
  h1 { font-size: 24px; }
  esp-web-install-button { display: block; margin: 24px 0; }
</style>
</head>
<body>
<h1>camd camera installer</h1>
<p>Plug your ESP32-CAM into this computer with a USB cable and press the button. It needs Chrome or Edge.</p>
<esp-web-install-button manifest="manifest.json">
  <button slot="activate">Install the firmware</button>
</esp-web-install-button>
<p>When it finishes, the camera opens a wifi network called <strong>camd-setup-XXXX</strong>. Join it with your phone to finish the setup.</p>
</body>
</html>
