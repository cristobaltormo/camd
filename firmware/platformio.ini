[env:esp32cam]
platform = espressif32@^6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DFW_VERSION=\"0.2.0\"
    -DCORE_DEBUG_LEVEL=1

[env:esp32cam-ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = 192.168.1.93
upload_flags =
    --auth=${sysenv.CAM_TOKEN}
