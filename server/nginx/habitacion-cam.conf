server {
    listen 80;
    server_name cam.cristobal.cc _;

    location = /healthz {
        proxy_pass http://127.0.0.1:8180;
    }

    location / {
        return 301 https://cam.cristobal.cc$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cam.cristobal.cc;

    ssl_certificate     /etc/ssl/habitacion-cam/fullchain.pem;
    ssl_certificate_key /etc/ssl/habitacion-cam/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ssl:2m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/live {
        proxy_pass http://127.0.0.1:8180;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_read_timeout 60s;
    }
}
