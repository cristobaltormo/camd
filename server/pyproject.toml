[project]
name = "camd"
version = "2.1.0"
description = "Self-hosted camera server for the ESP32-CAM: live view, motion and object detection, clips, alerts"
requires-python = ">=3.11"
license = "MIT"
keywords = ["esp32-cam", "camera", "surveillance", "object-detection", "self-hosted", "home-assistant", "pwa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "paho-mqtt>=2",
    "webauthn>=2",
    "pywebpush",
    "requests",
    "numpy",
    "opencv-python-headless>=4.7",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "cbor2"]

[project.urls]
Homepage = "https://github.com/OWNER/camd"
Documentation = "https://github.com/OWNER/camd/tree/main/docs"
Changelog = "https://github.com/OWNER/camd/blob/main/CHANGELOG.md"
Issues = "https://github.com/OWNER/camd/issues"

[project.scripts]
camd = "camd.__main__:main"
camd-ctl = "camd.ctl:main"

[tool.setuptools.packages.find]
include = ["camd*"]

[tool.setuptools.package-data]
camd = ["web/**/*", "build.txt"]

[tool.pytest.ini_options]
pythonpath = ["tests", "."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "ERA"]
ignore = ["B008", "B904", "SIM108"]
